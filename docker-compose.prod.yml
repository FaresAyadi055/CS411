services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8787
      - LOCAL_DB_PATH=file:/data/app.db
      - FRONTEND_URL=http://localhost:5173
      - CORS_ORIGIN=http://localhost:5173
      - BACKEND_URL=http://localhost:8787
      - COOKIE_SAMESITE=strict
    volumes:
      - dbdata:/data
    expose:
      - "8787"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick tunnel: prints a random https://*.trycloudflare.com URL on start.
    # No TUNNEL_TOKEN needed. Read it via: docker compose logs cloudflared
    command: ["tunnel", "--no-autoupdate", "--url", "http://backend:8787"]
    depends_on:
      - backend

volumes:
  dbdata:
