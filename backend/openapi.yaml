openapi: 3.0.3
info:
  title: Fidelito API
  version: 2.1.0
  description: |
    Digital loyalty card platform for Tunisian businesses.
    Clients display dynamic TOTP QR codes; cashiers scan to stamp loyalty cards.
    Businesses manage staff, rewards, and analytics. Admins manage merchants.

servers:
  - url: http://localhost:8787

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_token
  schemas:
    Profile:
      type: object
      properties:
        id: { type: string }
        role: { type: string, enum: [client, business, admin] }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        email: { type: string }
        address: { type: string, nullable: true }
        locale: { type: string, enum: [en, fr, ar] }
        createdAt: { type: string }
        lastUpdated: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
    Merchant:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: string, nullable: true }
        stampsPerReward: { type: integer }
        planTier: { type: string, enum: [starter, growth, pro] }
        pointsBalance: { type: integer }
        pointsFunded: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    CustomerCard:
      type: object
      properties:
        id: { type: string }
        customerId: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        merchantLogo: { type: string, nullable: true }
        fidelityPoints: { type: integer }
        lifetimePoints: { type: integer }
        lastVisitAt: { type: integer, nullable: true }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    Reward:
      type: object
      properties:
        id: { type: string }
        merchantId: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        stampsCost: { type: integer }
        imageUrl: { type: string, nullable: true }
        isAvailable: { type: boolean }
        canRedeem: { type: boolean }
        createdAt: { type: integer }
    StampTransaction:
      type: object
      properties:
        id: { type: string }
        merchantId: { type: string }
        customerId: { type: string }
        cashierId: { type: string }
        type: { type: string, enum: [ADD_POINTS, REMOVE_POINTS] }
        balanceType: { type: string, enum: [fidelity] }
        amount: { type: number }
        rewardId: { type: string, nullable: true }
        createdAt: { type: integer }
    DashboardStats:
      type: object
      properties:
        totalPointsAdded: { type: integer }
        pointsRedeemed: { type: integer }
        redemptionsCount: { type: integer }
        uniqueCustomers: { type: integer }
        newCustomersThisWeek: { type: integer }
        pointsBalance: { type: integer }
        pointsFunded: { type: integer }
        pointsGiven: { type: integer }
        transactionsToday: { type: integer }
        transactionsThisWeek: { type: integer }
        transactionsPrevWeek: { type: integer }
        transactionsThisMonth: { type: integer }
        dailyActivity:
          type: array
          items:
            type: object
            properties:
              date: { type: string }
              earned: { type: integer }
              redeemed: { type: integer }
        hourlyDistribution:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer }
              count: { type: integer }
        weekdayDistribution:
          type: array
          items:
            type: object
            properties:
              day: { type: integer }
              count: { type: integer }
        topCustomers:
          type: array
          items:
            type: object
            properties:
              customerId: { type: string }
              firstName: { type: string, nullable: true }
              lastName: { type: string, nullable: true }
              fidelityPoints: { type: integer }
              lifetimePoints: { type: integer }
        topRewards:
          type: array
          items:
            type: object
            properties:
              rewardId: { type: string }
              title: { type: string }
              redemptions: { type: integer }
        recentTransactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              balanceType: { type: string }
              amount: { type: number }
              createdAt: { type: integer }
              customerName: { type: string }
              rewardTitle: { type: string, nullable: true }

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200': { description: OK }

  # --- Auth ---
  /api/auth/sign-up/email:
    post:
      summary: Register (creates client account with TOTP secret)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string }
      responses:
        '201': { description: Created }

  /api/auth/sign-in/email:
    post:
      summary: Login
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: OK }

  # --- OTP ---
  /api/auth/otp/send-verification:
    post:
      summary: Send email verification code
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                locale: { type: string, enum: [en, fr, ar] }
      responses:
        '200': { description: Sent }

  /api/auth/otp/verify-email:
    post:
      summary: Verify email with code
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        '200': { description: Verified }

  # --- Client ---
  /api/client/subscribe:
    post:
      summary: Subscribe to a merchant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchantId]
              properties:
                merchantId: { type: string, description: Merchant ID or slug }
      responses:
        '200': { description: Subscribed }

  /api/client/qr/provision:
    post:
      summary: Provision TOTP secret and return QR
      description: Generates a TOTP secret for the authenticated client. Call once.
      responses:
        '200':
          description: QR payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: Base32 TOTP secret }
                  totp: { type: string, description: Current 6-digit TOTP code }
                  payload: { type: string, description: JSON QR payload }
                  qrDataUri: { type: string }
                  refreshInterval: { type: integer }
        '409': { description: Already provisioned }

  /api/client/qr/current:
    get:
      summary: Get current TOTP QR code
      description: Returns the current TOTP code and QR payload. Refreshes every 30s.
      responses:
        '200':
          description: Current QR
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp: { type: string }
                  payload: { type: string }
                  secret: { type: string }
                  qrDataUri: { type: string }
                  refreshInterval: { type: integer }
                  remainingSeconds: { type: integer }
        '400': { description: Not provisioned }

  /api/client/cards:
    get:
      summary: List all loyalty cards
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/CustomerCard' }

  /api/client/cards/{merchantId}:
    get:
      summary: Get card detail with transaction history
      parameters:
        - { name: merchantId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Card + transactions + rewards
          content:
            application/json:
              schema:
                type: object
                properties:
                  card: { $ref: '#/components/schemas/CustomerCard' }
                  transactions:
                    type: array
                    items: { $ref: '#/components/schemas/StampTransaction' }
                  rewards:
                    type: array
                    items: { $ref: '#/components/schemas/Reward' }
                  isSubscribed: { type: boolean }
        '404': { description: Card not found }

  /api/client/transactions:
    get:
      summary: List own stamp transactions
      responses:
        '200':
          description: Transactions

  /api/client/rewards/available:
    get:
      summary: List redeemable rewards across all merchants
      responses:
        '200':
          description: Available rewards

  /api/client/merchants:
    get:
      summary: List all merchants with subscriber counts
      responses:
        '200':
          description: Merchants list

  # --- Cashier ---
  /api/cashier/verify:
    post:
      summary: Verify QR or customerId and return card balances
      description: |
        Accepts three input modes:
        1. Full QR scan: { "qrPayload": "{...json...}" }
        2. Customer ID + 6-digit TOTP: { "customerId": "...", "qrPayload": "123456" }
        3. Customer ID only (skip TOTP): { "customerId": "..." }

        At least one of qrPayload or customerId is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                qrPayload: { type: string, description: Raw QR content (JSON string) or 6-digit TOTP code }
                customerId: { type: string, description: Customer user ID (bypasses QR parsing) }
              minProperties: 1
      responses:
        '200':
          description: Verify successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerId: { type: string }
                  customerName: { type: string }
                  merchantId: { type: string }
                  fidelityPoints: { type: integer }
                  lifetimePoints: { type: integer }
        '400': { description: Invalid QR or TOTP }
        '409': { description: QR already used (replay) }
        '403': { description: Not staff or merchant inactive }

  /api/cashier/adjust:
    post:
      summary: Adjust a customer's fidelity points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount]
              properties:
                customerId: { type: string }
                amount: { type: number, description: Positive to add, negative to deduct }
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  customerId: { type: string }
                  merchantId: { type: string }
                  fidelityPoints: { type: integer }
                  lifetimePoints: { type: integer }
                  transactionId: { type: string }
        '400': { description: Invalid amount or insufficient points }

  /api/cashier/merchant:
    get:
      summary: Get own merchant info
      responses:
        '200': { description: Merchant }

  /api/cashier/rewards:
    get:
      summary: List available rewards for own merchant
      responses:
        '200': { description: Rewards }

  /api/cashier/redeem:
    post:
      summary: Redeem a reward for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, rewardId]
              properties:
                customerId: { type: string }
                rewardId: { type: string }
      responses:
        '200': { description: Redeemed }
        '400': { description: Insufficient points }
        '404': { description: Reward not found }

  /api/cashier/stamps:
    get:
      summary: Recent stamps by this cashier
      responses:
        '200': { description: Stamps }

  # --- Business ---
  /api/business/dashboard:
    get:
      summary: Business analytics dashboard
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 14, minimum: 7, maximum: 90 }
          description: Size of the daily/hourly/weekday activity window.
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboard: { $ref: '#/components/schemas/DashboardStats' }

  /api/business/staff:
    get:
      summary: List staff members with per-staff stats
      responses:
        '200': { description: Staff list }
    post:
      summary: Add staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                role: { type: string, enum: [owner, cashier], default: cashier }
      responses:
        '200': { description: Added }
        '404': { description: User not found }
        '409': { description: Already staff }

  /api/business/staff/{userId}:
    delete:
      summary: Remove staff member
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Removed }
    patch:
      summary: Update staff role
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [owner, cashier] }
      responses:
        '200': { description: Updated }

  /api/business/customers:
    get:
      summary: List customers with stamp balances
      responses:
        '200': { description: Customers }

  /api/business/transactions:
    get:
      summary: All transactions (paginated)
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: Transactions }

  /api/business/rewards:
    get:
      summary: List rewards
      responses:
        '200': { description: Rewards }
    post:
      summary: Create reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                stampsCost: { type: integer, default: 10 }
      responses:
        '201': { description: Created }

  /api/business/rewards/{id}:
    patch:
      summary: Update reward
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                stampsCost: { type: integer }
                isAvailable: { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete reward
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/business/settings:
    patch:
      summary: Update merchant settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                stampsPerReward: { type: integer }
                logoUrl: { type: string, nullable: true }
      responses:
        '200': { description: Updated }

  # --- Profile ---
  /api/me:
    get:
      summary: Get own profile
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { $ref: '#/components/schemas/Profile' }
    patch:
      summary: Update own profile
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName: { type: string }
                lastName: { type: string }
                address: { type: string, nullable: true }
                locale: { type: string, enum: [en, fr, ar] }
      responses:
        '200': { description: Updated profile }

  # --- Admin ---
  /api/admin/stats:
    get:
      summary: Platform-wide stats
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: integer }
                  admins: { type: integer }
                  newUsers24h: { type: integer }
                  rateLimited24h: { type: integer }

  /api/admin/users:
    get:
      summary: List all users
      responses:
        '200': { description: Users }

  /api/admin/users/{id}:
    get:
      summary: Get user by ID
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: User }
    patch:
      summary: Update user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [client, business, admin] }
                firstName: { type: string }
                lastName: { type: string }
                address: { type: string, nullable: true }
                locale: { type: string, enum: [en, fr, ar] }
      responses:
        '200': { description: Updated }
    delete:
      summary: Delete user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/admin/rate-limits:
    get:
      summary: Recent rate-limit hits
      responses:
        '200': { description: Items }

  /api/admin/merchants:
    get:
      summary: List all merchants
      responses:
        '200':
          description: Merchants
    post:
      summary: Create merchant + assign owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, ownerEmail]
              properties:
                name: { type: string }
                slug: { type: string }
                ownerEmail: { type: string }
                stampsPerReward: { type: integer, default: 10 }
                planTier: { type: string, enum: [starter, growth, pro], default: starter }
                initialPoints: { type: integer, default: 0 }
      responses:
        '201': { description: Created }

  /api/admin/merchants/{id}:
    get:
      summary: Get merchant details
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Merchant }
    patch:
      summary: Update merchant
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                stampsPerReward: { type: integer }
                planTier: { type: string, enum: [starter, growth, pro] }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated }
    delete:
      summary: Soft-delete merchant (set inactive)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /api/admin/merchants/{id}/staff:
    get:
      summary: List merchant staff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Staff }

  /api/admin/merchants/{id}/stats:
    get:
      summary: Merchant analytics
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stats }

  /api/admin/merchants/{id}/customers:
    get:
      summary: List merchant customers with balances and spend
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Customers }

  /api/admin/merchants/{id}/adjust:
    post:
      summary: Adjust customer fidelity points (admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId, amount]
              properties:
                customerId: { type: string }
                amount: { type: number, description: Positive to add, negative to deduct }
      responses:
        '200': { description: Adjusted }
        '400': { description: Invalid amount or insufficient points }

  /api/admin/merchants/{id}/fund:
    post:
      summary: Fund merchant point balance
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
      responses:
        '200': { description: Funded }

  /api/admin/merchants/{id}/revoke:
    post:
      summary: Revoke merchant points
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1 }
      responses:
        '200': { description: Revoked }
