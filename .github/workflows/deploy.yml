name: deploy

on:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        # VITE_API_URL is left empty on purpose: the frontend calls /api on its
        # own origin, and the Cloudflare Worker proxies it to the backend. The
        # backend URL lives in the worker secret BACKEND_URL (set once via
        # `wrangler secret put BACKEND_URL <quick-tunnel-url>`), so tunnel
        # restarts do NOT require a frontend rebuild.
        run: pnpm --filter @app/frontend build

      - name: Deploy frontend to Cloudflare Workers
        run: pnpm --filter @app/frontend exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  backend:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: SSH to VPS and deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/fidelito
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend pnpm --filter @app/backend run db:migrate:manual
