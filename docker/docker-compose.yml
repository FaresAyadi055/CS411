services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: fidelito-backend:local
    container_name: fidelito-api
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      # SQLite database persisted on the fidelito-data volume (local storage)
      LOCAL_DB_PATH: file:/data/app.db
      DEPLOYMENT_MODE: vps
      BETTER_AUTH_URL: http://localhost:8787
      # CHANGE THESE IN PRODUCTION
      BETTER_AUTH_SECRET: change-me-in-prod-min-32-chars!!
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      # Convenience for local dev; disable in production
      DISABLE_RATE_LIMITING: "true"
      VAPID_SUBJECT: mailto:hello@fidelito.tn
    volumes:
      - fidelito-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:'+(process.env.PORT||8787)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  fidelito-data:
    driver: local
